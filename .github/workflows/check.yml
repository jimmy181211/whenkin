name: Check Whenkin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm db:verify-retention
      - run: pnpm run build
      - run: pnpm test:sites
      - run: docker compose up --build -d
      - name: Check the full PostgreSQL and HTTP flow
        run: node tests/smoke.js http://127.0.0.1:3000
      - name: Check the packaged manual cleanup command without deleting data
        run: docker compose exec -T app node App/backend/tools/cleanup.js --dry-run
      - if: always()
        run: docker compose down
